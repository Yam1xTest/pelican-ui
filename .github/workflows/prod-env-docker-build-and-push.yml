name: Publish Docker image for prod-env

on:
  push:
    branches:
      - master
      - feature/*
  # to allow to wait for a docker image to be published to proceed in another workflow
  workflow_call:

jobs:
  arm:
    runs-on: ubuntu-24.04-arm
    steps:
    - name: pull
      run: docker pull ghcr.io/yam1xtest/pelican-ui:local-env-sha-a03eaf6592e2d1f96ef8b8ee67d35c8221baef3c

    - name: Inspect
      run: docker inspect ghcr.io/yam1xtest/pelican-ui:local-env-sha-a03eaf6592e2d1f96ef8b8ee67d35c8221baef3c

  amd:
    runs-on: ubuntu-24.04
    steps:
    - name: pull
      run: docker pull ghcr.io/yam1xtest/pelican-ui:local-env-sha-a03eaf6592e2d1f96ef8b8ee67d35c8221baef3c

    - name: Inspect
      run: docker inspect ghcr.io/yam1xtest/pelican-ui:local-env-sha-a03eaf6592e2d1f96ef8b8ee67d35c8221baef3c
